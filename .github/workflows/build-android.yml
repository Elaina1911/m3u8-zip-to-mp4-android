name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Verify source tree
        shell: bash
        run: |
          test -f app/src/main/java/com/openai/m3u8zipmp4/ConverterService.java
          test -f app/src/main/java/com/openai/m3u8zipmp4/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "$code" > build-exit-code.txt
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-diagnostics
          path: |
            build.log
            build-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop on build failure
        shell: bash
        run: |
          code=$(cat build-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Android build failed with exit code $code"
            grep -nE "(^|[[:space:]])(error:|FAILURE:|What went wrong:|Execution failed for task|Caused by:)" build.log | tail -n 120 || true
            exit "$code"
          fi

      - name: Restore fixed release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing fixed Android signing secrets. Configure ANDROID_RELEASE_KEYSTORE_BASE64 and ANDROID_RELEASE_KEYSTORE_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          keytool -list -keystore release.jks \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias m3u8zipmp4 >/dev/null

      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          APK_NAME="M3U8-ZIP-to-MP4-v${VERSION_NAME}"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$APK_NAME-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.jks \
            --ks-key-alias m3u8zipmp4 \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --out "$APK_NAME.apk" "$APK_NAME-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: M3U8-ZIP-to-MP4-Android-${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          if-no-files-found: error
          retention-days: 30
