name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore and verify converter source
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/openai/m3u8zipmp4
          if compgen -G ".bootstrap/ConverterService.java.b64.*" > /dev/null; then
            cat .bootstrap/ConverterService.java.b64.* | tr -d '\r\n ' | base64 -d > app/src/main/java/com/openai/m3u8zipmp4/ConverterService.java
            echo "b25aaf718e8b582b4ab8d7c0407ddfca9a45b9404fa88d81fbdf6fe5b7038c64  app/src/main/java/com/openai/m3u8zipmp4/ConverterService.java" | sha256sum -c -
          else
            test -f app/src/main/java/com/openai/m3u8zipmp4/ConverterService.java
            echo "c63d4320162f24e116a597e2ac1d3459aefaca83f8becd12c3df1b6595fd4854  app/src/main/java/com/openai/m3u8zipmp4/ConverterService.java" | sha256sum -c -
          fi

      - name: Apply source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/openai/m3u8zipmp4/ConverterService.java')
          text = path.read_text(encoding='utf-8')
          if 'private void checkCancelled()' not in text:
              marker = '    @Override public IBinder onBind(Intent intent)'
              method = '''    private void checkCancelled() throws CancelledException {
                  if (cancelled || Thread.currentThread().isInterrupted()) throw new CancelledException();
              }

          '''
              if marker not in text:
                  raise SystemExit('Unable to locate insertion point for checkCancelled')
              text = text.replace(marker, method + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "$code" > build-exit-code.txt
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-diagnostics
          path: |
            build.log
            build-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop on build failure
        shell: bash
        run: |
          code=$(cat build-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Android build failed with exit code $code"
            grep -nE "(^|[[:space:]])(error:|FAILURE:|What went wrong:|Execution failed for task|Caused by:)" build.log | tail -n 120 || true
            exit "$code"
          fi

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -v -keystore release.jks -storepass android -keypass android \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=M3U8 ZIP MP4, OU=Local Build, O=Elaina1911, L=Singapore, ST=Singapore, C=SG"

      - name: Sign and verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            M3U8-ZIP-to-MP4-v3-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.jks --ks-pass pass:android --key-pass pass:android \
            --out M3U8-ZIP-to-MP4-v3.apk M3U8-ZIP-to-MP4-v3-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            M3U8-ZIP-to-MP4-v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: M3U8-ZIP-to-MP4-Android-v3
          path: M3U8-ZIP-to-MP4-v3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Replace bootstrap chunks with source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('.bootstrap/ConverterService.java.b64.*') != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/openai/m3u8zipmp4/ConverterService.java
          git rm -r .bootstrap
          git commit -m "Add converter service source"
          git push
